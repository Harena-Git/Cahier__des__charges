# =========================================================
# CONFIGURATION SERVEUR
# =========================================================
server.port=8080

# =========================================================
# CONFIGURATION DATASOURCE POSTGRESQL
# =========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/avs_db
spring.datasource.username=postgres
spring.datasource.password=harena
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# CONFIGURATION JPA / HIBERNATE
# =========================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# CONFIGURATION DES ENTITIES JPA
# =========================================================
spring.jpa.packages-to-scan=cahier.de.charge.model

# =========================================================
# GESTION DES TRANSACTIONS
# =========================================================
spring.jpa.open-in-view=false

# =========================================================
# LOGGING SQL (OPTIONNEL MAIS UTILE EN DEV)
# =========================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
